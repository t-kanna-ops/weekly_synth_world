name: Deploy Obfuscated Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          # CSSファイルをコピー（存在する場合）
          if [ -d "src" ]; then
            cp -r src/*.css dist/ 2>/dev/null || true
          else
            cp -r *.css dist/ 2>/dev/null || true
          fi

      # 1. HTMLの圧縮（改行・空白・コメント削除）
      - name: Minify HTML
        run: |
          if [ -d "src" ]; then
            npx -y html-minifier-terser --input-dir src --output-dir dist --collapse-whitespace --remove-comments --file-ext html
          else
            npx -y html-minifier-terser *.html --output-dir dist --collapse-whitespace --remove-comments
          fi

      # 2. JavaScriptの難読化
      - name: Obfuscate JavaScript
        run: |
          if [ -d "src" ]; then
            npx -y javascript-obfuscator src --output dist --compact true --control-flow-flattening true --numbers-to-expressions true
          else
            # 直下指定の場合はHTMLやCSSを除外してJSのみ処理
            npx -y javascript-obfuscator . --output dist --compact true --control-flow-flattening true --numbers-to-expressions true --exclude "dist/**"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
