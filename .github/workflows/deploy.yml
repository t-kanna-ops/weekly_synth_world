name: Deploy Obfuscated Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1. 成果物用フォルダの作成
      - name: Prepare dist directory
        run: mkdir -p dist

      # 2. HTMLの処理（圧縮またはコピー）
      - name: Process HTML & CSS
        run: |
          if [ -d "src" ]; then
            npx -y html-minifier-terser --input-dir src --output-dir dist --collapse-whitespace --remove-comments --file-ext html || cp -r src/*.html dist/ 2>/dev/null || true
            cp -r src/*.css dist/ 2>/dev/null || true
          else
            # 直下にHTMLがある場合：1ファイルずつ圧縮して dist に出力 (-o を使用)
            for file in *.html; do
              if [ -f "$file" ]; then
                npx -y html-minifier-terser "$file" -o "dist/$file" --collapse-whitespace --remove-comments || cp "$file" "dist/$file"
              fi
            done
            cp *.css dist/ 2>/dev/null || true
          fi

      # 3. JavaScriptの難読化
      - name: Obfuscate JavaScript
        run: |
          if [ -d "src" ]; then
            npx -y javascript-obfuscator src --output dist --compact true --control-flow-flattening true --numbers-to-expressions true
          else
            # 直下にJSがある場合：1ファイルずつ難読化して dist に出力
            for file in *.js; do
              if [ -f "$file" ]; then
                npx -y javascript-obfuscator "$file" --output "dist/$file" --compact true --control-flow-flattening true --numbers-to-expressions true || cp "$file" "dist/$file"
              fi
            done
          fi

      # 4. Pagesへのデプロイ準備
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 5. デプロイ実行
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
